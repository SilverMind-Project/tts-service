# Local deployment (dgx-box cluster, microk8s registry)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-service
  labels:
    app: tts-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tts-service
  template:
    metadata:
      labels:
        app: tts-service
    spec:
      containers:
      - name: tts-service
        image: localhost:32000/tts-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8600
          name: http
        env:
        - name: CUDA_DEVICE
          value: "cuda"
        - name: HF_HOME
          value: "/app/data/hf_cache"
        volumeMounts:
        - name: data
          mountPath: /app/data
        resources:
          requests:
            cpu: "500m"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "16Gi"
            nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 8600
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8600
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: tts-service-data
