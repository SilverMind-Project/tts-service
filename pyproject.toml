[project]
name = "tts-service"
version = "1.0.0"
description = "Self-hosted TTS service with OpenAI-compatible API for Cognitive Companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.44",
    "soundfile>=0.12",
    "pydub>=0.25",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Primary engine — Svara TTS (Indian English + Tamil, voice cloning)
svara = [
    "snac>=1.2",
    "accelerate>=0.30",
]
# Secondary engine — Indic Parler TTS (Indian English + Tamil, emotion prompts)
parler = [
    "parler-tts>=0.2.3",
]
# Lightweight fallback — MeloTTS (English only, runs on CPU)
melo = [
    "MeloTTS>=0.1",
]
# Fish Speech S2-Pro (80+ languages, voice cloning)
fish_speech = [
    "fish-speech @ git+https://github.com/fishaudio/fish-speech.git",
    "torchaudio>=2.2",
]
# SeamlessM4T v2 (36 languages, Meta)
seamless = [
    "torchaudio>=2.2",
]
# OpenAI Edge TTS (pass-through to remote openai-edge-tts service)
edge_tts = [
    "httpx>=0.27",
]
# Default build-compatible engine bundle
all = [
    # Keep MeloTTS opt-in for now: the current PyPI release ships a broken
    # sdist, which makes clean builds fail when `.[all]` is installed.
    # Keep Fish Speech opt-in for now: its protobuf constraint currently
    # conflicts with parler-tts, so the resolver cannot satisfy both.
    "tts-service[svara,parler,seamless,edge_tts]",
]
cpu = [
    "torch>=2.2",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
