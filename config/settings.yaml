app:
  name: "TTS Service"
  version: "1.0.0"

server:
  host: "0.0.0.0"
  port: 8200

# ── Engines ──────────────────────────────────────────────────────────────
# List of engines to load at startup. Order matters for fallback.
# Supported: svara, parler, melo, fish_speech, seamless, edge_tts
engines:
  enabled:
    - svara
  default: svara

  svara:
    model_id: "kenpath/svara-tts-v1"
    snac_model: "hubertsiuzdak/snac_24khz"
    device: "${CUDA_DEVICE:cuda}"
    dtype: "bfloat16"            # bfloat16, float16, float32
    max_tokens: 4096
    temperature: 0.6
    top_p: 0.95
    repetition_penalty: 1.1

  parler:
    model_id: "ai4bharat/indic-parler-tts"
    device: "${CUDA_DEVICE:cuda}"
    dtype: "float16"
    max_tokens: 2048

  melo:
    device: "auto"               # auto = GPU if available, else CPU
    default_voice: "EN-IN"

  fish_speech:
    model_id: "fishaudio/s2-pro"
    device: "${CUDA_DEVICE:cuda}"
    dtype: "bfloat16"
    max_tokens: 4096
    temperature: 0.7
    top_p: 0.8
    repetition_penalty: 1.2
    sample_rate: 44100

  seamless:
    model_id: "facebook/seamless-m4t-v2-large"
    device: "${CUDA_DEVICE:cuda}"
    dtype: "float16"
    max_tokens: 512

  edge_tts:
    base_url: "${EDGE_TTS_URL:http://192.168.1.31:6060/v1}"
    default_voice: "en-IN-NeerjaExpressiveNeural"
    default_speed: 0.85

# ── Storage ──────────────────────────────────────────────────────────────
storage:
  voice_samples_dir: "data/voice_samples"

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  level: "${LOG_LEVEL:INFO}"
